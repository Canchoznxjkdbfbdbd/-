# Cloudflare: real IP via /etc/nginx/conf.d/cloudflare-realip.conf (prep for orange-cloud). SSE /api/chat unchanged.
# Yandex Webmaster: /robots.txt and /sitemap.xml must return 200 without 301/302 (incl. plain HTTP).
#
# --- Rate limits (put zone in http{} context, e.g. /etc/nginx/nginx.conf or conf.d/) ---
# limit_req_zone $binary_remote_addr zone=nutri_chat:10m rate=12r/m;
#
# Node must listen on 127.0.0.1:3000 only (see server.js). Do NOT open firewall/ufw for :3000 —
# public traffic goes through nginx 80/443 → proxy_pass http://127.0.0.1:3000.
#
# Optional: allow only the DE bot VPS for /api/bot/chat (replace placeholder):
#   location /api/bot/chat {
#       allow YOUR.BOT.DE.IP;   # ← put real DE VPS IP here
#       deny all;
#       proxy_pass http://127.0.0.1:3000;
#       proxy_http_version 1.1;
#       proxy_set_header Host $host;
#       proxy_set_header X-Real-IP $remote_addr;
#       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#       proxy_set_header X-Forwarded-Proto $scheme;
#       proxy_set_header Connection "";
#       proxy_read_timeout 360s;
#   }

server {
    server_name nutricode.online www.nutricode.online;

    # Chat SSE: limit_req counts new requests (not stream duration). Keep buffering off + long read timeout.
    location /api/chat {
        # Requires limit_req_zone nutri_chat in http{} (see comment at top).
        limit_req zone=nutri_chat burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        gzip off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nutricode.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nutricode.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP: serve robots/sitemap as 200 (no HTTPS redirect). Everything else → HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name nutricode.online www.nutricode.online;

    location = /robots.txt {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
